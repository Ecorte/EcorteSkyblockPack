services:
  mrpack-server:
    build: .
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-Ecorte/EcorteSkyblockPack}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-300}
      CACHE_DIR: /data/cache
      HOST: 0.0.0.0
      PORT: ${PORT:-8787}
    volumes:
      - mrpack-cache:/data/cache
    restart: unless-stopped

volumes:
  mrpack-cache:
