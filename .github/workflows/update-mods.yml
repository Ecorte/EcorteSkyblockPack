name: Update Mods

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-mods
  cancel-in-progress: false

jobs:
  update-mods:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Pakku
        run: |
          curl -fsSL -o pakku.jar \
            https://github.com/juraj-hrivnak/Pakku/releases/latest/download/pakku.jar

      - name: Resolve latest pack version
        id: pack
        run: |
          LATEST=$(tr -d '[:space:]' < versions/latest)
          if [ -z "$LATEST" ] || [ ! -d "versions/$LATEST" ]; then
            echo "Invalid or missing pack version: '$LATEST'"
            exit 1
          fi
          if [ ! -f "versions/$LATEST/pakku.json" ]; then
            echo "No pakku.json in versions/$LATEST"
            exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "dir=versions/$LATEST" >> "$GITHUB_OUTPUT"

      - name: Update mods
        working-directory: ${{ steps.pack.outputs.dir }}
        run: |
          set -o pipefail
          java -jar "${{ github.workspace }}/pakku.jar" update -a 2>&1 | tee /tmp/pakku-update.log
          if grep -Eiq 'http request|unauthenticated|rate.?limit|too many requests|error:|exception' /tmp/pakku-update.log; then
            echo "Pakku reported API/request errors; refusing to treat as up to date."
            exit 1
          fi

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${{ steps.pack.outputs.dir }}"
          git reset -- "${{ steps.pack.outputs.dir }}/build" || true
          if git diff --cached --quiet; then
            echo "No mod updates."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update ${{ steps.pack.outputs.latest }} mods"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  export-and-release:
    needs: update-mods
    if: needs.update-mods.outputs.pushed == 'true'
    uses: ./.github/workflows/export-and-release.yml
    secrets: inherit
    permissions:
      contents: write
